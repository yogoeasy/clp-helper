# ==============================================================================
# CLP Helper - Cloudflare Custom WAF Rules Configuration
# File: /etc/clp/cf-rules.conf (or default template)
# Cloudflare Ruleset Engine (http_request_firewall_custom phase)
# Free Plan supports up to 5 custom rules.
# ==============================================================================

[rule:protect_wp_admin]
enabled = true
action = managed_challenge
description = "[CLP] Protect WP Admin & Login via Turnstile Challenge"
expression = (http.request.uri.path contains "/wp-login.php") or (http.request.uri.path contains "/wp-admin/" and not http.request.uri.path contains "/wp-admin/admin-ajax.php")

[rule:block_threats]
enabled = true
action = block
description = "[CLP] Block XML-RPC & Sensitive File Probing"
expression = (http.request.uri.path contains "xmlrpc") or (http.request.uri.path contains "/.") or (http.request.uri.path contains "wp-config") or (http.request.uri.path contains "debug.log") or (http.request.uri.path contains ".sql") or (http.request.uri.path contains ".bak")

[rule:block_bad_scanners]
enabled = false
action = block
description = "[CLP] Block Malicious Scanners & Empty User-Agent"
expression = (http.user_agent eq "") or (http.user_agent contains "sqlmap") or (http.user_agent contains "nikto") or (http.user_agent contains "wpscan") or (http.user_agent contains "acunetix") or (http.user_agent contains "masscan")

[rule:geo_admin_restriction]
enabled = false
action = managed_challenge
description = "[CLP] Geo-restrict Admin Access to Specific Countries"
expression = (http.request.uri.path contains "/wp-login.php" and not ip.geoip.country in {"TW" "HK" "US" "JP"}) or (http.request.uri.path contains "/wp-admin/" and not ip.geoip.country in {"TW" "HK" "US" "JP"})
