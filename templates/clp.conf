# CLP-HELPER-MANAGED-DEFAULTS v1
# ==============================================================================
# CLP Helper default settings
# Installed to /etc/clp/clp.conf and OVERWRITTEN on every install or update.
# Do not edit this file. To change a setting use:
#     sudo clp config -set <key>=<value>
# or edit /etc/clp/clp.local (only the keys you change; the rest keep these defaults).
# "sudo clp config -unset <key>" restores the default shown here.
# ==============================================================================

# Language: auto (follow the system locale), en_US or zh_TW
CLP_LANG="auto"

# PHP-FPM pool tuning used by "clp php-pm"
PHP_FPM_MAX_CHILDREN="15"
PHP_FPM_IDLE_TIMEOUT="30s"
PHP_FPM_MAX_REQUESTS="300"

# Cloudflare zone settings applied by "clp site <domain> -cf-waf=on"
# SSL mode: off | flexible | full | strict
CF_DEFAULT_MODE="strict"
# Always Use HTTPS: on | off
CF_ALWAYS_HTTPS="on"
# Minimum TLS version: 1.0 | 1.1 | 1.2 | 1.3
CF_MIN_TLS="1.2"

# Backups
# Local backup directory (absolute path, outside /home)
BACKUP_DIR="/root/clpBackup"
# Remote backup directory on the rclone remote (relative path); the site name is appended
BACKUP_REMOTE_DIR="clpBackup"
# Default backup type when -type is not given: db | full | compact | archive
BACKUP_TYPE="full"
# Default destination when -to is not given: local or an rclone remote name
BACKUP_TO="local"
# Remove backups older than N days after each "clp backup" when -expire is not given: off or 1d-3650d.
# WARNING: when set (e.g. 30d), EVERY backup run, including cron jobs, deletes older backups of that
# site, and for local backups also the restore rollback snapshots of that site older than N days.
BACKUP_EXPIRE="off"
