# ==============================================================================
# CLP Helper - Nginx HTTP Basic Authentication Snippet Template
# File: templates/nginx-httpauth.conf
#
# 此檔案為 CLP Helper httpauth 模組的參考範本，說明各種 HTTP 認證保護的 Nginx 配置結構。
# 實際生效設定由 CLP Helper 自動注入至 /etc/nginx/sites-enabled/<domain>.conf，
# 不需手動編輯本範本。
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. 全站保護 (clp httpauth <domain> -path=/)
#    注入位置：HTTPS server { ... root ...; } 層級（全域生效）
#    防護措施：為防止 satisfy any 繼承破壞敏感檔案封鎖，CLP Helper 會自動在
#             location ~/\.git 與 location = /xmlrpc.php 等區塊補上 auth_basic off;
# ------------------------------------------------------------------------------
# server {
#     listen 443 ssl;
#     ...
#     root /home/<siteuser>/htdocs/<domain>;
#
#     # --- CLP HTTPAUTH ROOT START ---
#     satisfy any;            # 啟用 IP 白名單時使用 (無白名單時省略 satisfy 與 allow/deny)
#     allow 203.0.113.10;     # IP 白名單 (可多行)
#     deny all;
#     auth_basic "Restricted Access";
#     auth_basic_user_file /home/<siteuser>/.htpasswd;
#     # --- CLP HTTPAUTH ROOT END ---
#
#     location ~/\.git {
#         auth_basic off;     # 自動補齊，避免被全站 satisfy any 突破
#         deny all;
#     }
#     ...
# }

# ------------------------------------------------------------------------------
# 2. 自訂路徑保護 (clp httpauth <domain> -path=/staging)
#    注入位置：server { ... } 內，於 location / 之前
#    必須用 location ^~：一般前綴 location 會被 CloudPanel 的 regex location（\.php$、靜態檔）
#    優先比對，/staging/index.php 等請求就不會經過密碼保護
# ------------------------------------------------------------------------------
# # --- CLP HTTPAUTH PATH: /staging START ---
# location ^~ /staging {
#     satisfy any;
#     allow 203.0.113.10;
#     deny all;
#     auth_basic "Restricted Access";
#     auth_basic_user_file /home/<siteuser>/.htpasswd;
#     try_files $uri $uri/ /index.php?$args;
# }
# # --- CLP HTTPAUTH PATH: /staging END ---

# ------------------------------------------------------------------------------
# 3. WordPress 後台保護 (clp httpauth <domain> -wp-admin=on)
#    注入位置：location ~/(wp-admin/|wp-login.php) { ... }
# ------------------------------------------------------------------------------
# location ~/(wp-admin/|wp-login.php) {
#     # --- CLP HTTPAUTH WPADMIN START ---
#     satisfy any;
#     allow 203.0.113.10;
#     deny all;
#     auth_basic "Restricted Area";
#     auth_basic_user_file /home/<siteuser>/.htpasswd;
#     # --- CLP HTTPAUTH WPADMIN END ---
#     ...
# }

# ------------------------------------------------------------------------------
# 4. IP 白名單獨立使用說明
#    clp httpauth <domain> -whitelist=203.0.113.10,10.0.0.0/24
#    白名單 IP 儲存於 /etc/nginx/security/<domain>.whitelist
#    當白名單存在時，上述各區塊自動加入 satisfy any + allow + deny all 指令。
# ------------------------------------------------------------------------------
